[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "s3filer"
version = "0.3.0"
description = "Dual-pane console file manager for local filesystem and Amazon S3 (FD/FILMTN style)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "s3filer contributors" }]
dependencies = [
    "boto3>=1.34.0",
    "textual>=0.80.0",
    "chardet>=5.2.0",
    "rich>=13.7.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.4.0"]

[project.scripts]
s3filer = "s3filer.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["s3filer*"]

[tool.setuptools.package-data]
s3filer = ["app.css", "py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"
